<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Твоя Упаковка: Статистика</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsgrid/1.5.3/jsgrid.min.css" />
    <link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsgrid/1.5.3/jsgrid-theme.min.css" />
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jsgrid/1.5.3/jsgrid.min.js"></script>
    <script type="text/javascript" src="moment.min.js"></script>
    <script type="text/javascript" src="moment-with-locales.js"></script>

    <script type="text/javascript" src="script.js"></script>
    <script type="text/css" rel="stylesheet" src="style.css"></script>
</head>

<body style="padding: 20px; font-family:'Verdana'; line-height: normal">

    <div class="container">
        <h3>Твоя Упаковка: Статистика</h3>
        <div class="row">
            <div class="col-sm-2">

                <select class="form-select" aria-label="Выберите менеджера" id="select-manager">
                    <option value="0" selected>Все менеджеры</option>
                    <option value="1">Елена</option>
                    <option value="2">Сергей</option>
                    <option value="3">Антон</option>
                </select>
            </div>
            <div class="col-sm-3">

                <select class="form-select" aria-label="Выберите клиента" id="select-klient">
                    <option value="0" selected>Все клиенты</option>
                </select>
            </div>
            <div class="col-sm-2">
                <div class="input-group mb-1">
                    <span class="input-group-text" >от</span>
                    <input type="date" class="form-control" value="2023-01-01" id="date-from">
                </div>
            </div>
            <div class="col-sm-2">
                <div class="input-group mb-1">
                    <span class="input-group-text" >до</span>
                    <input type="date" class="form-control" value="2023-12-31" id="date-to">
                </div>
            </div>
            <div class="col-sm-2">
                <button type="button" class="btn btn-primary" onclick="load()">Загрузить</button>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div id="jsGrid"></div>
            </div>
        </div>
    </div>

    <script>
        loadKntrs();
    </script>
</body>
</html>
