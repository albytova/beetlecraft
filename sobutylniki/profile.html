<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование профиля</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="style/profile.scss"/>
</head>
<body onload="load()">
<div class="edit-profile-form">
    <h2>Редактирование профиля</h2>
    <div id="editProfileForm">
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" required>

        <label for="beerStyles">Любимые стили пива:</label>
        <select id="beerStyles" name="beerStyles" multiple>
        </select>

        <label for="favoriteBeer">Любимое пиво:</label>
        <input type="text" id="favoriteBeer" name="favoriteBeer">

        <label for="meetFrequency">Как часто готов видеться:</label>
        <select id="meetFrequency" name="meetFrequency" required>
        </select>

        <label for="extraDrink">Дополнительный напиток:</label>
        <select id="extraDrink" name="extraDrink" required multiple>
        </select>

        <label for="about">О себе:</label>
        <textarea id="about" name="about">Люблю пиво и активный отдых.</textarea>

        <label for="photo">Изменить фото профиля:</label>
        <input type="file" id="photo" name="photo" accept="image/*" change="changePhoto()">

        <div class="buttons">
            <button onclick="goToProfilesPage()">Назад</button>
            <button onclick="save()">Сохранить изменения</button>
        </div>
    </div>
</div>

</body>
<script src="js/profile.js"></script>
</html>
